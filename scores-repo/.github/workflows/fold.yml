name: fold scores
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
jobs:
  fold:
    if: startsWith(github.event.issue.title, 'pilot ')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fold the issue into scores/
        env:
          TITLE: ${{ github.event.issue.title }}
          BODY: ${{ github.event.issue.body }}
          LOGIN: ${{ github.event.issue.user.login }}
        run: python3 scripts/fold.py
      - name: commit
        run: |
          git config user.name pilot-bot
          git config user.email pilot-bot@users.noreply.github.com
          git add scores
          git diff --cached --quiet || git commit -m "scores: ${{ github.event.issue.user.login }}"
          git push
      - name: close the issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }} --comment "Folded into scores/. Thanks."
